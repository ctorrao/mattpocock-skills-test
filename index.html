<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Splitter</title>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-inner">
        <h1>PDF Splitter</h1>
        <p class="tagline">Your PDF never leaves your browser.</p>
      </div>
    </header>

    <div class="page">
      <main class="stages">
        <section class="stage" id="source-pdf-stage">
          <h2 class="stage-title">Source PDF</h2>
          <input
            id="source-pdf-input"
            class="file-input"
            type="file"
            accept="application/pdf"
          />
          <label
            class="button button-secondary file-button"
            for="source-pdf-input"
            >Choose a Source PDF</label
          >
          <p id="source-pdf-summary" class="stage-summary"></p>
        </section>

        <div
          id="problem-summary"
          class="problems"
          role="status"
          aria-live="polite"
        ></div>

        <section class="stage" id="range-set-stage">
          <h2 class="stage-title">Range Set</h2>
          <label class="visually-hidden" for="range-set-input">Range Set</label>
          <input
            id="range-set-input"
            class="text-input"
            type="text"
            placeholder="e.g. 1-3, 4, 7-"
            disabled
          />

          <div class="burst">
            <button
              id="burst-button"
              class="button button-secondary"
              type="button"
              disabled
            >
              Burst
            </button>
            <p class="burst-hint">every page becomes its own Part</p>
          </div>

          <div
            id="range-set-interpretation"
            class="interpretation"
            role="status"
            aria-live="polite"
          ></div>

          <button
            id="split-button"
            class="button button-primary"
            type="button"
            disabled
          >
            Split
          </button>
        </section>

        <section class="stage" id="parts-stage">
          <h2 class="stage-title">Parts</h2>
          <ul id="result-list" class="parts"></ul>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
